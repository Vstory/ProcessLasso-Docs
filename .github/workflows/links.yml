name: Check links

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lychee
        uses: e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            'docs/**/*.md'
            'README.md'
          fail: true
